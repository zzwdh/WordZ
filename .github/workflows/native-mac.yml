name: Native macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/macos-native/WordZMac/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-mac.yml'
  push:
    paths:
      - 'apps/macos-native/WordZMac/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-mac.yml'

permissions:
  contents: read

jobs:
  guard-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run architecture guard
        run: zsh apps/macos-native/WordZMac/Scripts/architecture-guard.sh

      - name: Run Swift tests
        run: swift test --package-path apps/macos-native/WordZMac
